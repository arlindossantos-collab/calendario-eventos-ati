<!-- Header NAVEGAÇÃO COM FUNDO AZUL INSTITUCIONAL E LOGO AMPLIADA -->
  <header class="bg-blue-900 border-b border-blue-800 sticky top-0 z-30 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-4">
      
      <!-- Marca / Logotipo do Governo + ATI (Tamanho Expandido e Ajustado) -->
      <div class="flex items-center min-h-[60px]">
        <!-- Substitua 'logo-ati.png' pelo caminho da imagem no seu repositório -->
        <img 
          src="logo-ati.png" 
          alt="Governo de Pernambuco - ATI" 
          class="h-16 md:h-20 max-h-24 w-auto object-contain transition-all" 
          onerror="this.style.display='none'; document.getElementById('logoFallback').classList.remove('hidden');"
        >
        
        <!-- Fallback em texto caso a imagem não seja encontrada -->
        <div id="logoFallback" class="hidden flex items-center gap-3">
          <div class="bg-blue-800 text-white p-2.5 rounded-xl">
            <i data-lucide="building-2" class="w-7 h-7"></i>
          </div>
          <div>
            <h1 class="text-lg font-bold text-white leading-tight">GOVERNO DE PERNAMBUCO</h1>
            <p class="text-xs text-blue-200 font-medium">ATI - Agência Estadual de Tecnologia da Informação</p>
          </div>
        </div>
      </div>

      <!-- Navegação em Abas (Calendário vs Dashboard) -->
      <nav class="flex items-center gap-1 bg-blue-950/60 p-1.5 rounded-xl border border-blue-800/80">
        <button id="navCalendar" onclick="mudarAba('calendario')" class="flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-semibold transition bg-blue-600 shadow-xs text-white">
          <i data-lucide="calendar" class="w-4 h-4"></i> Calendário
        </button>
        <button id="navDashboard" onclick="mudarAba('dashboard')" class="flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-semibold text-blue-200 transition hover:text-white">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboards & Indicadores
        </button>
      </nav>

      <!-- Ações de Header -->
      <div class="flex items-center gap-2 md:gap-3">
        <button id="btnHeaderCriar" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2.5 rounded-xl text-xs flex items-center gap-2 transition shadow-sm">
          <i data-lucide="plus-circle" class="w-4 h-4"></i> Criar Evento
        </button>
        <div id="authSection" class="flex items-center gap-2 border-l border-blue-800 pl-3"></div>
      </div>
    </div>
  </header>
